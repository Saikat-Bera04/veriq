name: CI/CD Pipeline

on:
  push:
    branches: [main, master, kirann]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Workspace Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format Check
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Clippy Warnings Check
        run: cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Workspace Tests
        run: cargo test --manifest-path backend/Cargo.toml --workspace
      - name: Malicious RPC Tests
        run: cargo test --manifest-path backend/Cargo.toml -p veriq-malicious-rpc --features demo

  frontend:
    name: Frontend SDK & Dashboard Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Test Suites (SDK + Dashboard)
        run: pnpm -r test
      - name: Build All Packages & Dashboard
        run: pnpm -r build

  contracts:
    name: Smart Contract Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Build Smart Contracts
        run: cd smart-contract && forge build --sizes
      - name: Test Smart Contracts
        run: cd smart-contract && forge test -vvv

  docker:
    name: Docker Container Image Builds
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build VeriQ Engine Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.engine
          push: false
          tags: veriq-engine:ci
      - name: Build VeriQ Attacker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.attacker
          push: false
          tags: veriq-attacker:ci

  deploy-gate:
    name: Production Deployment Gate
    runs-on: ubuntu-latest
    needs: [rust, frontend, contracts, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment Approved
        run: echo "All test and security gates passed. Ready for production webhook trigger or cloud deployment."
